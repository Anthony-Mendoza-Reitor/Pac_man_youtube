<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PAC-MAN ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:#0a0a0f;
  display:flex;justify-content:center;align-items:center;
  font-family:'Orbitron',sans-serif;
}
#cabinet{display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 0 30px rgba(0,180,255,.35));}

/* MARQUEE */
#marquee{
  background:linear-gradient(135deg,#1a0030,#0d0030,#1a0030);
  border:3px solid #ff0;border-bottom:none;border-radius:14px 14px 0 0;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;height:52px;
}
#marquee::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,0,.03) 40px,rgba(255,255,0,.03) 41px);}
#marquee-text{font-size:24px;font-weight:900;color:#ff0;
  text-shadow:0 0 8px #ff0,0 0 20px #ff0,0 0 40px #ff0;
  letter-spacing:8px;animation:marqueePulse 2s ease-in-out infinite;z-index:1;}
#marquee-dots{display:flex;gap:6px;position:absolute;bottom:5px;}
#marquee-dots span{width:6px;height:6px;border-radius:50%;animation:dotCycle 1s linear infinite;}
#marquee-dots span:nth-child(1){background:#f00;animation-delay:0s;}
#marquee-dots span:nth-child(2){background:#ff0;animation-delay:.15s;}
#marquee-dots span:nth-child(3){background:#0f0;animation-delay:.3s;}
#marquee-dots span:nth-child(4){background:#0ff;animation-delay:.45s;}
#marquee-dots span:nth-child(5){background:#f0f;animation-delay:.6s;}
#marquee-dots span:nth-child(6){background:#ff0;animation-delay:.75s;}

/* FRAME */
#frame{background:linear-gradient(180deg,#1a0a2e,#0d0820 50%,#150a25);
  border:4px solid #4400aa;border-top:none;border-bottom:none;
  padding:8px 14px;position:relative;}
#frame::before{content:'';position:absolute;left:0;top:0;bottom:0;width:11px;
  background:repeating-linear-gradient(180deg,#2200aa,#2200aa 4px,#110055 4px,#110055 8px);}
#frame::after{content:'';position:absolute;right:0;top:0;bottom:0;width:11px;
  background:repeating-linear-gradient(180deg,#2200aa,#2200aa 4px,#110055 4px,#110055 8px);}

/* SCORE PANEL */
#score-panel{display:flex;justify-content:space-between;align-items:center;
  padding:5px 10px;margin:0 11px 6px;
  background:rgba(0,0,0,.5);border:1px solid #330088;border-radius:4px;}
.score-block{display:flex;flex-direction:column;align-items:center;gap:1px;}
.score-label{font-size:7px;color:#aa88ff;letter-spacing:2px;}
.score-value{font-size:16px;color:#fff;text-shadow:0 0 8px #fff;}
#level-display{font-size:12px;color:#ff0;text-shadow:0 0 8px #ff0;}
#lives-display{display:flex;gap:5px;align-items:center;}
.life-icon{width:11px;height:11px;background:#ff0;border-radius:50%;box-shadow:0 0 5px #ff0;}

/* CANVAS */
#canvas-wrapper{position:relative;margin:0 11px;
  border:3px solid #0033cc;
  box-shadow:inset 0 0 20px rgba(0,50,200,.3),0 0 20px rgba(0,50,200,.3);
  background:#000;overflow:hidden;}
canvas{display:block;}
#crt{position:absolute;inset:0;pointer-events:none;z-index:20;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px);}

/* OVERLAYS */
#ui-overlay{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  background:rgba(0,0,0,.85);color:#fff;z-index:10;
  visibility:hidden;opacity:0;transition:opacity .5s;}
#ui-overlay.visible{visibility:visible;opacity:1;}
#game-over-text{font-size:32px;font-weight:900;color:#ff0055;
  text-shadow:0 0 10px #ff0055,0 0 30px #ff0055;margin-bottom:8px;animation:glitch 2s infinite;}
#ui-subtitle{font-size:10px;color:#aaa;letter-spacing:3px;margin-bottom:14px;}
#final-score{font-size:22px;color:#0ff;text-shadow:0 0 10px #0ff;margin-bottom:4px;}
#high-score-display{font-size:11px;color:#ff0;margin-bottom:18px;}
#restart-btn{padding:10px 28px;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;
  background:transparent;color:#ff0;border:2px solid #ff0;border-radius:4px;
  cursor:pointer;letter-spacing:3px;text-shadow:0 0 8px #ff0;
  box-shadow:0 0 15px rgba(255,255,0,.3);transition:all .2s;}
#restart-btn:hover{background:rgba(255,255,0,.1);}

#level-clear{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  background:rgba(0,0,0,.8);z-index:10;visibility:hidden;opacity:0;transition:opacity .4s;}
#level-clear.visible{visibility:visible;opacity:1;}
#level-clear-text{font-size:28px;font-weight:900;color:#ff0;
  text-shadow:0 0 20px #ff0,0 0 40px #ff0;animation:marqueePulse .5s ease-in-out infinite;}
#level-clear-sub{font-size:11px;color:#0ff;letter-spacing:3px;margin-top:8px;}

/* BOTTOM */
#bottom-panel{background:linear-gradient(180deg,#150a25,#1a0a2e);
  border:4px solid #4400aa;border-top:2px solid #220055;border-radius:0 0 12px 12px;
  padding:10px 18px;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;}
#bottom-panel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:11px;
  background:repeating-linear-gradient(180deg,#2200aa,#2200aa 4px,#110055 4px,#110055 8px);border-radius:0 0 0 12px;}
#bottom-panel::after{content:'';position:absolute;right:0;top:0;bottom:0;width:11px;
  background:repeating-linear-gradient(180deg,#2200aa,#2200aa 4px,#110055 4px,#110055 8px);border-radius:0 0 12px 0;}
#controls-row{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;}
#joystick-area{display:flex;flex-direction:column;align-items:center;gap:3px;}
#joystick-label{font-size:7px;color:#6644aa;letter-spacing:2px;}
#joystick{width:56px;height:56px;
  background:radial-gradient(circle at 40% 35%,#555,#222,#111);
  border-radius:50%;border:3px solid #444;
  box-shadow:0 4px 10px rgba(0,0,0,.8),inset 0 2px 4px rgba(255,255,255,.1);
  position:relative;cursor:pointer;}
#joystick-ball{width:24px;height:24px;
  background:radial-gradient(circle at 35% 30%,#888,#333,#111);
  border-radius:50%;border:2px solid #555;
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 8px rgba(0,0,0,.9);transition:transform .08s;}
#joystick-base{width:74px;height:12px;background:radial-gradient(ellipse,#333,#111);border-radius:50%;border:2px solid #444;}
#buttons-area{display:flex;flex-direction:column;align-items:center;gap:5px;}
#buttons-label{font-size:7px;color:#6644aa;letter-spacing:2px;}
#action-buttons{display:flex;gap:10px;}
.arcade-btn{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 1px 3px rgba(255,255,255,.2);transition:transform .1s;}
.arcade-btn:active{transform:translateY(2px);}
.btn-red{background:radial-gradient(circle at 40% 30%,#ff4444,#aa0000);}
.btn-yellow{background:radial-gradient(circle at 40% 30%,#ffff44,#aaaa00);}
.btn-blue{background:radial-gradient(circle at 40% 30%,#4444ff,#0000aa);}
.btn-green{background:radial-gradient(circle at 40% 30%,#44ff44,#00aa00);}
#fruit-legend{display:flex;gap:8px;font-size:9px;color:#776699;align-items:center;flex-wrap:wrap;justify-content:center;}
#coin-area{font-size:7px;color:#443366;letter-spacing:2px;display:flex;gap:8px;align-items:center;}
#coin-slot{width:46px;height:6px;background:#111;border:2px solid #333;border-radius:2px;}

@keyframes marqueePulse{0%,100%{text-shadow:0 0 10px #ff0,0 0 20px #ff0;}50%{text-shadow:0 0 20px #ff0,0 0 40px #ff0,0 0 60px #ff0;}}
@keyframes dotCycle{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.7);}}
@keyframes glitch{0%,100%{transform:translate(0);}2%{transform:translate(-2px,1px);}4%{transform:translate(2px,-1px);}6%{transform:translate(0);}}
</style>
</head>
<body>
<div id="cabinet">
  <div id="marquee">
    <div id="marquee-text">★ PAC-MAN ★</div>
    <div id="marquee-dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>
  <div id="frame">
    <div id="score-panel">
      <div class="score-block"><span class="score-label">1UP</span><span class="score-value" id="score-val">0</span></div>
      <div class="score-block"><span id="level-display">LVL 1</span></div>
      <div class="score-block"><span class="score-label">HIGH</span><span class="score-value" id="high-val">0</span></div>
      <div class="score-block"><span class="score-label">LIVES</span><div id="lives-display"></div></div>
    </div>
    <div id="canvas-wrapper">
      <canvas id="game"></canvas>
      <div id="crt"></div>
      <div id="ui-overlay">
        <div id="game-over-text">GAME OVER</div>
        <div id="ui-subtitle">INSERT COIN TO CONTINUE</div>
        <div id="final-score">Score: 0</div>
        <div id="high-score-display">HIGH SCORE: 0</div>
        <button id="restart-btn" onclick="restartGame()">▶ PLAY AGAIN</button>
      </div>
      <div id="level-clear">
        <div id="level-clear-text">LEVEL CLEAR!</div>
        <div id="level-clear-sub">GET READY...</div>
      </div>
    </div>
  </div>
  <div id="bottom-panel">
    <div id="controls-row">
      <div id="joystick-area">
        <div id="joystick-label">CONTROL</div>
        <div id="joystick"><div id="joystick-ball"></div></div>
        <div id="joystick-base"></div>
      </div>
      <div id="fruit-legend">
        <span>🍒100</span><span>🍓300</span><span>🍊500</span><span>🍋700</span><span>🍎1000</span>
      </div>
      <div id="buttons-area">
        <div id="buttons-label">BUTTONS</div>
        <div id="action-buttons">
          <button class="arcade-btn btn-red"></button>
          <button class="arcade-btn btn-yellow"></button>
          <button class="arcade-btn btn-blue"></button>
          <button class="arcade-btn btn-green"></button>
        </div>
      </div>
    </div>
    <div id="coin-area"><span>INSERT COIN</span><div id="coin-slot"></div><span>©1980 NAMCO</span></div>
  </div>
</div>

<script>
/* ============================================================
   AUDIO
============================================================ */
let audioCtx=null;
function ensureAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,type,dur,vol=0.12,delay=0){
  if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);
    g.gain.setValueAtTime(vol,audioCtx.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+delay+dur);
    o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur);
  }catch(e){}
}
function sfxDot(t){tone(t?880:660,'square',.05,.05);}
function sfxPower(){[200,300,400,500,600].forEach((f,i)=>tone(f,'sawtooth',.1,.1,i*.07));}
function sfxEatGhost(){[800,600,900,400].forEach((f,i)=>tone(f,'square',.1,.15,i*.06));}
function sfxDeath(){[440,415,392,370,349,330,311,294].forEach((f,i)=>tone(f,'sawtooth',.13,.18,i*.07));}
function sfxFruit(){[523,659,784,1047].forEach((f,i)=>tone(f,'triangle',.15,.18,i*.07));}
function sfxLevelClear(){[523,587,659,698,784,880,988,1047].forEach((f,i)=>tone(f,'triangle',.2,.2,i*.09));}
function sfxExtraLife(){[440,550,660,880,1100].forEach((f,i)=>tone(f,'sine',.2,.2,i*.08));}
let sirenIv=null,sirenPh=0;
function sirenStart(){
  if(sirenIv) return;
  sirenIv=setInterval(()=>{
    if(!gameRunning||!player.alive) return;
    const p=sirenPh%3;
    tone([200,210,220][p],'sine',.13,.04);
    setTimeout(()=>tone([250,260,270][p],'sine',.13,.04),140);
    sirenPh++;
  },330);
}
function sirenStop(){clearInterval(sirenIv);sirenIv=null;}

/* ============================================================
   MAP  — 21×23, TILE=20px. Transcribed from reference image.
   Tunnel row=11. Ghost house rows 9-13. Player start (10,17).
   Verified: 0 unreachable pellets, 250 reachable tiles.
============================================================ */
const TILE=20, COLS=21, ROWS=23;
const TUNNEL_ROW=11;

const FINAL_MAP = [
  '#####################',  // 0
  '#.........#.........#',  // 1
  '#.###.###.#.###.###.#',  // 2
  '#o###.###.#.###.###o#',  // 3  power pellets
  '#.###.###.#.###.###.#',  // 4
  '#...................#',  // 5
  '#.###.#.#####.#.###.#',  // 6
  '#.....#...#...#.....#',  // 7
  '#####.###   ###.#####',  // 8  ghost house top
  '#####.         .#####',  // 9  open passage cols 6-14
  '#####.  ##-##  .#####',  // 10 gate at col 10
  '     .   # #   .     ',  // 11 TUNNEL ROW
  '#####.  #####  .#####',  // 12
  '#####.         .#####',  // 13
  '#####.###   ###.#####',  // 14 ghost house bottom
  '#.....#...#...#.....#',  // 15
  '#.###.#.#####.#.###.#',  // 16
  '#...................#',  // 17 player start
  '#.###.###.#.###.###.#',  // 18
  '#o..#.....#.....#..o#',  // 19 power pellets
  '###.#.###.#.###.#.###',  // 20
  '#.........#.........#',  // 21
  '#####################',  // 22
];

const WALL='#', DOT='.', POWER='o', GATE='-';

let map=[];
function resetMap(){ map=FINAL_MAP.map(r=>r.split('')); }
resetMap();

/* ============================================================
   Sync cabinet widths to canvas size
============================================================ */
const canvas=document.getElementById('game');
canvas.width=COLS*TILE;   // 420
canvas.height=ROWS*TILE;  // 460
const ctx=canvas.getContext('2d');

const CW=canvas.width+25*2;
['marquee','frame','bottom-panel'].forEach(id=>{
  document.getElementById(id).style.width=CW+'px';
});

/* ============================================================
   GAME STATE
============================================================ */
let level=1, lives=3, highScore=0, gameRunning=false;
let frightenedMode=false, frightenedTimer=0;
let particles=[], floatTexts=[];
let frameCount=0;
let currentDir={x:1,y:0}, bufferedDir={x:1,y:0};
let ghostEatCombo=0, fruitDotsEaten=0;
let activeFruit=null, levelClearing=false, dotToggle=false;

/* ============================================================
   PARTICLES & FLOAT TEXT
============================================================ */
class Particle{
  constructor(x,y,c){
    this.x=x;this.y=y;this.c=c;
    this.vx=(Math.random()-.5)*5;this.vy=(Math.random()-.5)*5-1;
    this.life=35+Math.random()*20;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.1;this.life--;}
  draw(){
    ctx.globalAlpha=Math.max(0,this.life/55);
    ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}
function burst(x,y,c,n=10){for(let i=0;i<n;i++)particles.push(new Particle(x,y,c));}

class FloatText{
  constructor(x,y,t,c){this.x=x;this.y=y;this.t=t;this.c=c;this.life=70;}
  update(){this.y-=.5;this.life--;}
  draw(){
    ctx.globalAlpha=Math.max(0,this.life/70);
    ctx.fillStyle=this.c;ctx.font='bold 10px Orbitron,sans-serif';
    ctx.textAlign='center';ctx.fillText(this.t,this.x,this.y);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
}
function floatTxt(x,y,t,c){floatTexts.push(new FloatText(x,y,t,c));}

/* ============================================================
   PLAYER
============================================================ */
// Player starts at col 10, row 17 — center of open corridor
const PSTART={x:10,y:17};
const player={
  x:PSTART.x, y:PSTART.y,
  px:PSTART.x*TILE, py:PSTART.y*TILE,
  speed:1.6, score:0, alive:true,
  mouth:.1, mouthDir:1, facing:'right'
};
function initPlayer(){
  player.x=PSTART.x; player.y=PSTART.y;
  player.px=PSTART.x*TILE;  // exact integer
  player.py=PSTART.y*TILE;  // exact integer
  player.alive=true; player.mouth=.1; player.mouthDir=1; player.facing='right';
  currentDir={x:1,y:0}; bufferedDir={x:1,y:0};
}

/* ============================================================
   WALL CHECKS — always use integer tile coords
============================================================ */
function tileAt(tx,ty){
  tx=Math.round(tx); ty=Math.round(ty);
  if(ty===TUNNEL_ROW && (tx<0||tx>=COLS)) return ' '; // tunnel open
  if(tx<0||tx>=COLS||ty<0||ty>=ROWS) return WALL;
  return map[ty][tx];
}
function isWallP(tx,ty){ return tileAt(tx,ty)===WALL; }
function isWallG(tx,ty){ const t=tileAt(tx,ty); return t===WALL||t===GATE; }

// Can player step from integer grid (gx,gy) in direction dir?
function canStep(gx,gy,dir){
  const nx=Math.round(gx)+dir.x, ny=Math.round(gy)+dir.y;
  if(ny===TUNNEL_ROW && (nx<0||nx>=COLS)) return true; // tunnel entrance
  return !isWallP(nx,ny);
}

/* ============================================================
   PLAYER UPDATE — tile-locked movement (no float grid coords)
   player.x / player.y are always integers (the "current tile")
   player.px / player.py are pixel positions (multiples of TILE
   when snapped, may be between tiles while moving)
============================================================ */
function updatePlayer(){
  const spd=Math.min(player.speed*(1+level*.04), 2.0);

  // Check alignment: pixel position is exact multiple of TILE
  const snapX=Math.round(player.px/TILE)*TILE;
  const snapY=Math.round(player.py/TILE)*TILE;
  const aligned = (Math.abs(player.px-snapX) <= 0.5) &&
                  (Math.abs(player.py-snapY) <= 0.5);

  if(aligned){
    // Lock onto grid — integer pixel coords
    player.px=snapX;
    player.py=snapY;
    player.x=snapX/TILE;  // now a true integer
    player.y=snapY/TILE;

    // Try buffered dir first
    if(canStep(player.x, player.y, bufferedDir)){
      currentDir={x:bufferedDir.x, y:bufferedDir.y};
    }
    // If current dir also blocked → stand still
    if(!canStep(player.x, player.y, currentDir)){
      mouthAnim();
      eatTile(player.x, player.y);
      return;
    }
  } else {
    // Mid-tile: allow instant 180 reversal only
    if(bufferedDir.x===-currentDir.x && bufferedDir.y===-currentDir.y){
      currentDir={x:bufferedDir.x, y:bufferedDir.y};
    }
  }

  // Move
  player.px+=currentDir.x*spd;
  player.py+=currentDir.y*spd;

  // ── TUNNEL WRAP ───────────────────────────────────────────
  const rowNow=Math.round(player.py/TILE);
  if(rowNow===TUNNEL_ROW){
    if(player.px < -TILE*0.5){
      player.px=(COLS-1)*TILE; player.x=COLS-1;
    } else if(player.px > (COLS-0.5)*TILE){
      player.px=0; player.x=0;
    }
  }

  // Update integer grid pos from pixel pos
  player.x=Math.max(0,Math.min(COLS-1, Math.round(player.px/TILE)));
  player.y=Math.max(0,Math.min(ROWS-1, Math.round(player.py/TILE)));

  // Facing
  if(currentDir.x>0)       player.facing='right';
  else if(currentDir.x<0)  player.facing='left';
  else if(currentDir.y<0)  player.facing='up';
  else if(currentDir.y>0)  player.facing='down';

  mouthAnim();
  eatTile(player.x,player.y);
  checkFruitCollision();
}

function mouthAnim(){
  player.mouth+=.06*player.mouthDir;
  if(player.mouth>.28) player.mouthDir=-1;
  if(player.mouth<.01) player.mouthDir=1;
}

function eatTile(gx,gy){
  if(gx<0||gx>=COLS||gy<0||gy>=ROWS) return;
  const t=map[gy][gx];
  if(t===DOT){
    map[gy][gx]=' '; player.score+=10; fruitDotsEaten++;
    burst(gx*TILE+TILE/2,gy*TILE+TILE/2,'rgba(255,255,220,.8)',3);
    dotToggle=!dotToggle; sfxDot(dotToggle);
    if(fruitDotsEaten===70||fruitDotsEaten===170) spawnFruit();
  } else if(t===POWER){
    map[gy][gx]=' '; player.score+=50; fruitDotsEaten++;
    burst(gx*TILE+TILE/2,gy*TILE+TILE/2,'#0ff',18);
    sfxPower();
    frightenedMode=true;
    frightenedTimer=Math.max(180, 480-level*40);
    ghostEatCombo=0;
    ghosts.forEach(g=>{
      if(g.state!=='RETURNING'&&g.state!=='COOLDOWN'&&g.state!=='HOUSE'){
        g.state='FRIGHTENED'; g.path=[];
      }
    });
  }
}

function checkFruitCollision(){
  if(!activeFruit||activeFruit.eaten) return;
  const fx=activeFruit.col*TILE+TILE/2, fy=activeFruit.row*TILE+TILE/2;
  const pcx=player.px+TILE/2, pcy=player.py+TILE/2;
  if(Math.hypot(fx-pcx,fy-pcy)<TILE*.9){
    activeFruit.eaten=true;
    player.score+=activeFruit.pts;
    floatTxt(fx,fy,''+activeFruit.pts,'#ff0');
    burst(fx,fy,'#ff0',20);
    sfxFruit(); activeFruit=null;
  }
}

/* ============================================================
   FRUITS
============================================================ */
const FRUITS=[
  {emoji:'🍒',pts:100},{emoji:'🍓',pts:300},{emoji:'🍊',pts:500},
  {emoji:'🍋',pts:700},{emoji:'🍎',pts:1000}
];
function spawnFruit(){

/* ============================================================
   GHOST
============================================================ */
// Ghost house: interior rows 9-13, cols 6-14
// Exit corridor: col 5 (vertical) or col 15. Gate at (10,10).
// Ghosts exit by reaching row 8 via col 5 or 15.
const GH_EXIT   = {x:10, y:11}; // inside house — returning ghosts go here
const GH_SPAWN  = {x:10, y:9};  // inside top area, just above gate
class Ghost{
  constructor(x,y,color,type){
    this.sx=x; this.sy=y; this.x=x; this.y=y;
    this.px=x*TILE; this.py=y*TILE;
    this.color=color; this.type=type;
    this.state='HOUSE'; this.houseT=0;
    this.path=[]; this.dir={x:1,y:0};
  }
  reset(){
    this.x=this.sx; this.y=this.sy;
    this.px=this.sx*TILE; this.py=this.sy*TILE;
    this.state='HOUSE';
    // staggered release times
    const d={blinky:60, pinky:150, inky:260, clyde:370};
    this.houseT = d[this.type]||60;
    this.path=[];
  }
  get speed(){ return 1.1; }

  update(){
    // ── HOUSE: bob in place, then exit ──────────────────────
    if(this.state==='HOUSE'){
      this.houseT--;
      // bob up/down visually
      this.py = this.sy*TILE + Math.sin(frameCount*0.12)*4;
      if(this.houseT<=0){
        // Snap back to grid and start exiting
        this.px=this.sx*TILE; this.py=this.sy*TILE;
        this.x=this.sx; this.y=this.sy;
        this.state='EXITING';
        this.path=[];
      }
      return;
    }

    // ── EXITING: pathfind through gate to outside ────────────
    if(this.state==='EXITING'){
      // target: col 5, row 7 (just outside the house on the main corridor)
      const exitTarget={x:5, y:7};
      if(!this.path.length) this.path = aStarGhost({x:this.x,y:this.y}, exitTarget, true);
      if(this.path.length){
        this._moveAlongPath(2.0);
        if(this.x===exitTarget.x && this.y===exitTarget.y){
          this.state='NORMAL'; this.path=[];
        }
      } else {
        // fallback: just set NORMAL anyway
        this.state='NORMAL';
      }
      return;
    }

    // ── COOLDOWN: wait inside house after being eaten ────────
    if(this.state==='COOLDOWN'){
      this.houseT--;
      this.py = this.sy*TILE + Math.sin(frameCount*0.12)*4;
      if(this.houseT<=0){
        this.px=this.sx*TILE; this.py=this.sy*TILE;
        this.x=this.sx; this.y=this.sy;
        this.state='EXITING'; this.path=[];
      }
      return;
    }

    // ── RETURNING: eyes fly back to house ───────────────────
    if(this.state==='RETURNING'){
      if(!this.path.length) this.path = aStarGhost({x:this.x,y:this.y}, GH_EXIT, true);
      if(this.path.length){
        this._moveAlongPath(3.5);
        if(this.x===GH_EXIT.x && this.y===GH_EXIT.y){
          this.state='COOLDOWN';
          this.houseT=200;
          this.x=this.sx; this.y=this.sy;
          this.px=this.sx*TILE; this.py=this.sy*TILE;
          this.path=[];
        }
      } else {
        // Can't path — just teleport back
        this.state='COOLDOWN'; this.houseT=200;
        this.x=this.sx; this.y=this.sy;
        this.px=this.sx*TILE; this.py=this.sy*TILE;
      }
      return;
    }

    // ── NORMAL / FRIGHTENED ──────────────────────────────────
    if(!this.path.length) this.calcPath();
    this._moveAlongPath( this.state==='FRIGHTENED'
      ? Math.max(0.6, this.speed*(1+level*0.06)*0.5)
      : Math.min(2.5, this.speed*(1+level*0.06)) );
  }

  _moveAlongPath(spd){
    if(!this.path.length) return;
    const nxt=this.path[0];
    const tx=nxt.x*TILE, ty=nxt.y*TILE;
    const dx=tx-this.px, dy=ty-this.py, dist=Math.hypot(dx,dy);
    if(dist<=spd){
      this.x=nxt.x; this.y=nxt.y; this.px=tx; this.py=ty;
      this.path.shift();
      if(this.state==='NORMAL'||this.state==='FRIGHTENED') this.calcPath();
    } else {
      this.dir = Math.abs(dx)>Math.abs(dy) ? {x:Math.sign(dx),y:0} : {x:0,y:Math.sign(dy)};
      this.px+=dx/dist*spd; this.py+=dy/dist*spd;
    }
    // tunnel wrap
    if(this.y===TUNNEL_ROW){
      if(this.px < -TILE){ this.px=(COLS-1)*TILE; this.x=COLS-1; this.path=[]; }
      else if(this.px >= COLS*TILE){ this.px=0; this.x=0; this.path=[]; }
    }
  }

  calcPath(){
    let tgt={x:player.x, y:player.y};
    if(this.state==='FRIGHTENED'){
      const corners=[{x:1,y:1},{x:COLS-2,y:1},{x:1,y:ROWS-2},{x:COLS-2,y:ROWS-2}];
      tgt=corners[{blinky:0,pinky:1,inky:2,clyde:3}[this.type]||0];
    } else {
      if(this.type==='pinky')
        tgt={x:Math.max(0,Math.min(COLS-1,player.x+currentDir.x*4)),
             y:Math.max(0,Math.min(ROWS-1,player.y+currentDir.y*4))};
      else if(this.type==='inky' && Math.random()>0.4)
        tgt={x:Math.max(0,Math.min(COLS-1,player.x+(Math.random()>0.5?3:-3))), y:player.y};
      else if(this.type==='clyde' && Math.hypot(player.x-this.x,player.y-this.y)<8)
        tgt={x:COLS-2, y:ROWS-2};
    }
    this.path = aStarGhost({x:this.x,y:this.y}, tgt, false);
    // random fallback
    if(!this.path.length){
      const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      const valid=dirs.filter(d=>!isWallG(this.x+d.x,this.y+d.y));
      if(valid.length){
        const d=valid[Math.floor(Math.random()*valid.length)];
        this.path=[{x:this.x+d.x, y:this.y+d.y}];
      }
    }
  }
  draw(){ drawGhost(this); }
}

/* ============================================================
   A*  — allowGate=true lets ghosts pass through '-' (exit/return)
============================================================ */
function aStarGhost(start, end, allowGate=false){
  const K=n=>`${n.x},${n.y}`;
  let open=[{...start}], came={}, gCost={[K(start)]:0}, f={[K(start)]:h(start,end)};
  let it=0;
  while(open.length && it++<800){
    open.sort((a,b)=>f[K(a)]-f[K(b)]);
    const cur=open.shift();
    if(cur.x===end.x && cur.y===end.y){
      let path=[],c=cur,k=K(c);
      while(came[k]){ path.unshift({...c}); c=came[k]; k=K(c); }
      return path;
    }
    for(const d of [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]){
      let nx=cur.x+d.x, ny=cur.y+d.y;
      if(ny===TUNNEL_ROW){ if(nx<0)nx=COLS-1; else if(nx>=COLS)nx=0; }
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS) continue;
      const t=tileAt(nx,ny);
      if(t===WALL) continue;
      if(t===GATE && !allowGate) continue;
      const nb={x:nx,y:ny}, cost=gCost[K(cur)]+1;
      if(gCost[K(nb)]===undefined || cost<gCost[K(nb)]){
        came[K(nb)]=cur; gCost[K(nb)]=cost;
        f[K(nb)]=cost+h(nb,end);
        if(!open.some(n=>n.x===nx&&n.y===ny)) open.push(nb);
      }
    }
  }
  return [];
}
function aStar(s,e){ return aStarGhost(s,e,false); }
function h(a,b){ return Math.abs(a.x-b.x)+Math.abs(a.y-b.y); }

/* ============================================================

============================================================ */
function checkGhostCollision(){
  for(const g of ghosts){
    if(g.state==='RETURNING'||g.state==='COOLDOWN'||g.state==='HOUSE') continue;
    if(Math.hypot(g.px+TILE/2-(player.px+TILE/2), g.py+TILE/2-(player.py+TILE/2))<TILE*.78){
      if(g.state==='FRIGHTENED'){
        ghostEatCombo++;
        const pts=200*Math.pow(2,ghostEatCombo-1);
        player.score+=pts;
        floatTxt(g.px+TILE/2,g.py,''+pts,'#0ff');
        burst(g.px+TILE/2,g.py+TILE/2,g.color,25);
        sfxEatGhost();
        g.state='RETURNING';g.path=[];
      } else {
        playerDeath();return;
      }
    }
  }
}

/* ============================================================
   WALL RENDERING
   Strategy: for every edge between a WALL tile and a PATH tile,
   draw a thick rounded stroke ON THE PATH SIDE of that edge.
   This creates continuous, connected rounded-corner wall outlines
   exactly like the reference image.
============================================================ */
const WCOL  = '#1a1aee';   // wall fill
const WLINE = '#4488ff';   // neon border color
const WGLOW = '#2266ff';
const LW    = 3.5;         // line width
const CR    = 5;           // corner radius (pixels)

function isW(x,y){
  if(y===TUNNEL_ROW && (x<0||x>=COLS)) return false; // tunnel open
  if(x<0||x>=COLS||y<0||y>=ROWS) return true;
  const t=map[y][x];
  return t==='#';
}

// Given a wall tile at (wx,wy), for each face adjacent to a path tile,
// we draw the border line inset by INSET pixels into the wall tile.
const INSET = LW / 2 + 0.5;

function drawMaze(){
  // ── 1. Black background ──────────────────────────────────
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // ── 2. Fill wall tiles dark navy ─────────────────────────
  ctx.fillStyle=WCOL;
  for(let y=0;y<ROWS;y++)
    for(let x=0;x<COLS;x++)
      if(isW(x,y)) ctx.fillRect(x*TILE,y*TILE,TILE,TILE);

  // ── 3. Draw wall borders as continuous rounded paths ──────
  // For each wall tile we draw arcs/lines on its boundary faces.
  // Key insight: we draw from the WALL tile's perspective, placing
  // the line on the inner face of the wall (touching the open tile).
  ctx.save();
  ctx.strokeStyle = WLINE;
  ctx.lineWidth   = LW;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.shadowColor = WGLOW;
  ctx.shadowBlur  = 10;

  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(!isW(x,y)) continue;

      const T  = TILE;
      const px = x*T, py = y*T;
      const s  = INSET;  // inset from edge

      // Neighbours open?
      const oN  = !isW(x,  y-1);
      const oS  = !isW(x,  y+1);
      const oW  = !isW(x-1,y  );
      const oE  = !isW(x+1,y  );
      const oNW = !isW(x-1,y-1);
      const oNE = !isW(x+1,y-1);
      const oSW = !isW(x-1,y+1);
      const oSE = !isW(x+1,y+1);

      // ── Straight edges ──────────────────────────────────
      // Top face (wall above is open)
      if(oN){
        const x1 = px + (oW ? CR : 0);
        const x2 = px + T - (oE ? CR : 0);
        if(x2 > x1){ ctx.beginPath(); ctx.moveTo(x1,py+s); ctx.lineTo(x2,py+s); ctx.stroke(); }
      }
      // Bottom face
      if(oS){
        const x1 = px + (oW ? CR : 0);
        const x2 = px + T - (oE ? CR : 0);
        if(x2 > x1){ ctx.beginPath(); ctx.moveTo(x1,py+T-s); ctx.lineTo(x2,py+T-s); ctx.stroke(); }
      }
      // Left face
      if(oW){
        const y1 = py + (oN ? CR : 0);
        const y2 = py + T - (oS ? CR : 0);
        if(y2 > y1){ ctx.beginPath(); ctx.moveTo(px+s,y1); ctx.lineTo(px+s,y2); ctx.stroke(); }
      }
      // Right face
      if(oE){
        const y1 = py + (oN ? CR : 0);
        const y2 = py + T - (oS ? CR : 0);
        if(y2 > y1){ ctx.beginPath(); ctx.moveTo(px+T-s,y1); ctx.lineTo(px+T-s,y2); ctx.stroke(); }
      }

      // ── Convex corners (wall tile has open tiles on 2 perpendicular faces) ──
      // These produce the rounded outer corners of wall blocks
      if(oN && oW){
        ctx.beginPath();
        ctx.arc(px+CR, py+CR, CR-s, Math.PI, 1.5*Math.PI);
        ctx.stroke();
      }
      if(oN && oE){
        ctx.beginPath();
        ctx.arc(px+T-CR, py+CR, CR-s, 1.5*Math.PI, 2*Math.PI);
        ctx.stroke();
      }
      if(oS && oW){
        ctx.beginPath();
        ctx.arc(px+CR, py+T-CR, CR-s, 0.5*Math.PI, Math.PI);
        ctx.stroke();
      }
      if(oS && oE){
        ctx.beginPath();
        ctx.arc(px+T-CR, py+T-CR, CR-s, 0, 0.5*Math.PI);
        ctx.stroke();
      }

      // ── Concave corners (open diagonal, both straight neighbours are walls) ──
      // These produce the rounded inner corners of corridors
      if(oNW && !oN && !oW){
        ctx.beginPath();
        ctx.arc(px, py, CR+s, 0, 0.5*Math.PI);
        ctx.stroke();
      }
      if(oNE && !oN && !oE){
        ctx.beginPath();
        ctx.arc(px+T, py, CR+s, 0.5*Math.PI, Math.PI);
        ctx.stroke();
      }
      if(oSW && !oS && !oW){
        ctx.beginPath();
        ctx.arc(px, py+T, CR+s, 1.5*Math.PI, 2*Math.PI);
        ctx.stroke();
      }
      if(oSE && !oS && !oE){
        ctx.beginPath();
        ctx.arc(px+T, py+T, CR+s, Math.PI, 1.5*Math.PI);
        ctx.stroke();
      }
    }
  }
  ctx.restore();

  // ── 4. Dots, power pellets, gate ─────────────────────────
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const t = map[y][x];
      const cx = x*TILE+TILE/2, cy = y*TILE+TILE/2;
      if(t===DOT){
        ctx.fillStyle='#ffddaa';
        ctx.beginPath(); ctx.arc(cx,cy,2.2,0,Math.PI*2); ctx.fill();
      } else if(t===POWER){
        const p = Math.sin(frameCount*.13)*2.5+6;
        ctx.fillStyle='#ffcc44';
        ctx.shadowColor='#ffaa00'; ctx.shadowBlur=16;
        ctx.beginPath(); ctx.arc(cx,cy,p,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      } else if(t===GATE){
        ctx.fillStyle='rgba(255,160,220,.9)';
        ctx.fillRect(x*TILE+3, y*TILE+TILE*.38, TILE-6, TILE*.25);
      }
    }
  }

  // ── 5. Tunnel entrance arrows ─────────────────────────────
  ctx.font='bold 9px sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,100,.7)';
  ctx.fillText('◄', 6, TUNNEL_ROW*TILE+TILE/2+4);
  ctx.fillText('►', COLS*TILE-6, TUNNEL_ROW*TILE+TILE/2+4);
  ctx.textAlign='left';
}

function drawPlayer(){
  const cx=player.px+TILE/2, cy=player.py+TILE/2, r=TILE*.46;
  const fa={right:0,left:Math.PI,up:-Math.PI/2,down:Math.PI/2}[player.facing]||0;
  const m=player.mouth*Math.PI;
  ctx.fillStyle='#ffff00';ctx.shadowColor='#ffff00';ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,fa+m,fa+Math.PI*2-m);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  // eye
  const ex=cx+Math.cos(fa-.65)*r*.5, ey=cy+Math.sin(fa-.65)*r*.5;
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(ex,ey,1.8,0,Math.PI*2);ctx.fill();
}

function drawGhost(g){
  const cx=g.px+TILE/2, cy=g.py+TILE/2, r=TILE*.44;

  // Eyes-only when returning to house
  if(g.state==='RETURNING'){
    ctx.fillStyle='white'; ctx.shadowColor='white'; ctx.shadowBlur=5;
    ctx.beginPath();
    ctx.arc(cx-3.5,cy-2,2.8,0,Math.PI*2);
    ctx.arc(cx+3.5,cy-2,2.8,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#003fff'; ctx.shadowBlur=0;
    ctx.beginPath();
    ctx.arc(cx-3.5+g.dir.x*1.5,cy-2+g.dir.y*1.5,1.4,0,Math.PI*2);
    ctx.arc(cx+3.5+g.dir.x*1.5,cy-2+g.dir.y*1.5,1.4,0,Math.PI*2);
    ctx.fill();
    return;
  }

  // Semi-transparent while inside house waiting
  if(g.state==='HOUSE'||g.state==='COOLDOWN') ctx.globalAlpha=0.55;

  // Color
  let col=g.color;
  if(g.state==='FRIGHTENED')
    col=(frightenedTimer<100 && Math.floor(frameCount/8)%2===0) ? '#fff' : '#1919a6';

  // Body
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=11;
  ctx.beginPath();
  ctx.arc(cx, cy-1, r, Math.PI, 0);
  const sw=r*2/4;
  for(let i=0;i<4;i++) ctx.lineTo(cx-r+i*sw+sw, cy+r+(i%2===0?2.5:-2.5));
  ctx.lineTo(cx-r, cy+r+2);
  ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;

  // Eyes
  if(g.state!=='FRIGHTENED'){
    ctx.fillStyle='white';
    ctx.beginPath();
    ctx.ellipse(cx-3.5,cy-3,2.8,3.5,0,0,Math.PI*2);
    ctx.ellipse(cx+3.5,cy-3,2.8,3.5,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#003fff';
    ctx.beginPath();
    ctx.arc(cx-3.5+g.dir.x*1.4,cy-3+g.dir.y*1.4,1.6,0,Math.PI*2);
    ctx.arc(cx+3.5+g.dir.x*1.4,cy-3+g.dir.y*1.4,1.6,0,Math.PI*2);
    ctx.fill();
  } else {
    // Frightened face
    ctx.strokeStyle='#ffb8b8'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(cx-5,cy-4); ctx.lineTo(cx-2.5,cy-2);
    ctx.moveTo(cx-2.5,cy-4); ctx.lineTo(cx-5,cy-2);
    ctx.moveTo(cx+2.5,cy-4); ctx.lineTo(cx+5,cy-2);
    ctx.moveTo(cx+5,cy-4); ctx.lineTo(cx+2.5,cy-2);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-5,cy+3);
    for(let i=0;i<=4;i++) ctx.lineTo(cx-5+i*2.5, cy+3+(i%2===0?2:-2));
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawFruit(){
  if(!activeFruit||activeFruit.eaten) return;
  activeFruit.timer--;
  if(activeFruit.timer<=0){activeFruit=null;return;}
  const a=activeFruit.timer<100?activeFruit.timer/100:1;
  ctx.globalAlpha=a;ctx.font=`${TILE*1.05}px sans-serif`;ctx.textAlign='center';
  ctx.fillText(activeFruit.emoji,activeFruit.col*TILE+TILE/2,activeFruit.row*TILE+TILE*1.05);
  ctx.textAlign='left';ctx.globalAlpha=1;
}

/* ============================================================
   MAIN LOOP
============================================================ */
function update(){
  if(!player.alive) return;
  frameCount++;
  updatePlayer();
  ghosts.forEach(g=>g.update());
  checkGhostCollision();
  if(!player.alive) return;
  for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=0)particles.splice(i,1);}
  for(let i=floatTexts.length-1;i>=0;i--){floatTexts[i].update();if(floatTexts[i].life<=0)floatTexts.splice(i,1);}
  updateScoreUI();
  if(frightenedMode){
    frightenedTimer--;
    if(frightenedTimer<=0){
      frightenedMode=false;ghostEatCombo=0;
      ghosts.forEach(g=>{if(g.state==='FRIGHTENED'){g.state='NORMAL';g.path=[];}});
    }
  }
  if(!levelClearing&&checkLevelClear()){
    levelClearing=true;gameRunning=false;
    setTimeout(doNextLevel,400);
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawMaze();drawFruit();
  particles.forEach(p=>p.draw());floatTexts.forEach(t=>t.draw());
  if(player.alive) drawPlayer();
  // Draw all ghosts (HOUSE/COOLDOWN ghosts drawn semi-transparent via drawGhost)
  ghosts.forEach(g=>g.draw());
}

function loop(){
  if(gameRunning) update();
  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   INPUT
============================================================ */
document.addEventListener('keydown',e=>{
  ensureAudio();
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','s','S','a','A','d','D'].includes(k)) e.preventDefault();
  if(k==='ArrowUp'   ||k==='w'||k==='W') bufferedDir={x:0,y:-1};
  if(k==='ArrowDown' ||k==='s'||k==='S') bufferedDir={x:0,y:1};
  if(k==='ArrowLeft' ||k==='a'||k==='A') bufferedDir={x:-1,y:0};
  if(k==='ArrowRight'||k==='d'||k==='D') bufferedDir={x:1,y:0};
});

document.getElementById('joystick').addEventListener('mousedown',e=>{
  ensureAudio();
  const r=e.currentTarget.getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  const ball=document.getElementById('joystick-ball');
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0){bufferedDir={x:1,y:0};ball.style.transform='translate(calc(-50% + 9px),-50%)';}
    else    {bufferedDir={x:-1,y:0};ball.style.transform='translate(calc(-50% - 9px),-50%)';}
  } else {
    if(dy>0){bufferedDir={x:0,y:1};ball.style.transform='translate(-50%,calc(-50% + 9px))';}
    else    {bufferedDir={x:0,y:-1};ball.style.transform='translate(-50%,calc(-50% - 9px))';}
  }
});
document.addEventListener('mouseup',()=>{
  document.getElementById('joystick-ball').style.transform='translate(-50%,-50%)';
});

let tStart={x:0,y:0};
canvas.addEventListener('touchstart',e=>{ensureAudio();tStart={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tStart.x, dy=e.changedTouches[0].clientY-tStart.y;
  if(Math.abs(dx)>Math.abs(dy)) bufferedDir=dx>0?{x:1,y:0}:{x:-1,y:0};
  else bufferedDir=dy>0?{x:0,y:1}:{x:0,y:-1};
  e.preventDefault();
},{passive:false});

/* ============================================================
   START / RESTART
============================================================ */
function startGame(){
  resetMap();
  level=1;lives=3;frameCount=0;
  particles=[];floatTexts=[];
  frightenedMode=false;frightenedTimer=0;
  fruitDotsEaten=0;activeFruit=null;levelClearing=false;
  initPlayer();player.score=0;
  initGhosts();
  document.getElementById('level-display').textContent='LVL 1';
  updateLivesUI();updateScoreUI();
  gameRunning=true;
  sirenStart();
}
function restartGame(){
  document.getElementById('ui-overlay').classList.remove('visible');
  sirenStop();setTimeout(startGame,150);
}

startGame();
loop();
</script>
